# Local-development infrastructure only. Server releases use docker-compose.yml
# together with protected infra.env; do not put production passwords here.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: hailiang
      POSTGRES_PASSWORD: hailiang
      POSTGRES_DB: hailiang_skills_multi_profile_v1
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - local_postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - local_redis_data:/data

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.108.0
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./deploy/otel-collector.yml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "127.0.0.1:${OTEL_HOST_PORT:-4318}:4318"
      - "127.0.0.1:${OTEL_METRICS_HOST_PORT:-9464}:9464"

  skill-sandbox-runner:
    build:
      context: ..
      dockerfile: Dockerfile.sandbox-runner
    environment:
      HAILIANG_SANDBOX_SHARED_TOKEN: ${HAILIANG_SANDBOX_SHARED_TOKEN:-local-dev-sandbox-token}
      HAILIANG_SANDBOX_IMAGE_DIGEST: local-compose
    ports:
      - "127.0.0.1:${SANDBOX_RUNNER_PORT:-8091}:8081"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8081/healthz')"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  local_postgres_data:
  local_redis_data:
