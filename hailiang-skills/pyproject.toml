[project]
name = "hailiang-skills"
version = "0.1.0"
description = "Skill-oriented admission and multiroute planning service"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "starlette>=0.40.0,<0.46.0",
  "uvicorn>=0.30.0",
  "pydantic>=2.8.0",
  "sqlalchemy>=2.0.0",
  "PyYAML>=6.0",
  "ms-agent>=1.6.0",
  "loguru>=0.7.0",
  "cryptography>=43.0.0,<45.0.0",
  "alibabacloud_green20220302==3.2.4",
  "alembic>=1.13.0",
  "httpx>=0.27.0",
  "opentelemetry-api>=1.27.0",
  "opentelemetry-sdk>=1.27.0",
  "opentelemetry-exporter-otlp-proto-http>=1.27.0",
  "prometheus-client>=0.21.0",
  "psycopg[binary]>=3.2.0",
  "redis>=5.1.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
