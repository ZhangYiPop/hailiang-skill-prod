schema_version: 1
id: student_growth_expert_team
name: 学生成长专家团
topology: team
rule_file: TEAM.md
coordinator_expert_id: e_career_planner
consultation_policy:
  max_subtasks: 3
  max_parallel: 3
  max_depth: 1
fallback_expert_id: e_career_planner
collaboration_rules: |
  无信息依赖的子任务可并行；若某一子任务需要另一位专家的结论作为输入，编排首应为其填写 depends_on。
  例如测评类结论需先产出再做规划时，规划子任务依赖测评子任务；升学规划与家庭教育各自给建议时可并行。
  不得引用本团以外的专家。
members:
  - expert_id: e_career_planner
    mention_name: 升学规划专家
    routing_brief: 负责升学路径、选科、院校专业与学业规划。
    applicable_stages:
      - 小学
      - 初中
      - 高中
  - expert_id: family_education_expert
    mention_name: 家庭教育专家
    routing_brief: 负责亲子沟通、家庭规则、学习习惯与明确请求的 MBTI 自我探索。
    applicable_stages:
      - 小学
      - 初中
      - 高中
