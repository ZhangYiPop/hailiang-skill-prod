facts:
  grade:
    label: "孩子年级"
    input_type: "single_select"
    placeholder: "请选择孩子当前年级"
    example: "例如：初二"
    submit_mode: "auto"
    options:
      - label: "小学"
        value: "小学"
      - label: "初一"
        value: "初一"
      - label: "初二"
        value: "初二"
      - label: "初三"
        value: "初三"
      - label: "高一"
        value: "高一"
      - label: "高二"
        value: "高二"
      - label: "高三"
        value: "高三"
  student_province:
    label: "高考省份"
    input_type: "text"
    placeholder: "请输入省份"
    example: "例如：浙江"
    submit_mode: "auto"
  physical_requirements:
    label: "身高"
    input_type: "text"
    placeholder: "请输入身高"
    example: "例如：175cm"
    submit_mode: "manual"
  subject_group:
    label: "选科组合"
    input_type: "single_select"
    placeholder: "请选择选科"
    example: "例如：物理"
    submit_mode: "auto"
    options:
      - label: "物理"
        value: "物理"
      - label: "历史"
        value: "历史"
  score_total:
    label: "当前分数"
    input_type: "text"
    placeholder: "请输入分数"
    example: "例如：580"
    submit_mode: "manual"
  score_recent_avg:
    label: "最近三次大考均分"
    input_type: "text"
    placeholder: "请输入最近三次大考均分"
    example: "例如：565"
    submit_mode: "manual"
  budget_level:
    label: "预算水平"
    input_type: "single_select"
    placeholder: "请选择预算水平"
    example: "例如：大于5万/年"
    submit_mode: "auto"
    options:
      - label: "大于5万"
        value: ">5万"
      - label: "小于5万"
        value: "<5万"
  career_orientation:
    label: "职业兴趣"
    input_type: "multi_select"
    placeholder: "请选择职业兴趣"
    example: "例如：军警类、师范类"
    submit_mode: "manual"
    options:
      - label: "师范类"
        value: "师范类"
      - label: "军警类"
        value: "军警类"
      - label: "飞行员"
        value: "飞行员"
      - label: "其他"
        value: "其他"
  exam_qualification_status:
    label: "学考是否合格"
    input_type: "single_select"
    placeholder: "请选择学考是否合格"
    example: "例如：合格"
    submit_mode: "auto"
    options:
      - label: "合格"
        value: "合格"
      - label: "不合格"
        value: "不合格"
  hukou_years:
    label: "户籍是否连续满三年？"
    input_type: "single_select"
    placeholder: "请选择户籍是否连续满三年？"
    example: "例如：是"
    submit_mode: "auto" 
    options:
      - label: "是"
        value: "连续3年户籍"
      - label: "否"
        value: "否"
  special_identity_tags:
    label: "荣誉情况"
    input_type: "multi_select"
    placeholder: "五大学科竞赛省级及以上奖项"
    example: "例如：五大学科竞赛省级及以上奖项"
    submit_mode: "manual"
    options:
      - label: "五大学科竞赛省级及以上奖项"
        value: "五大学科竞赛省级及以上奖项"
      - label: "五大学科竞赛国家集训队成员"
        value: "五大学科竞赛国家集训队成员"
      - label: "其他"
        value: "其他"